[project]
name = "fit-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.17.1",
    "apscheduler>=3.11.0,<4.0.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.121.1",
    "fastapi-users[sqlalchemy]>=15.0.1",
    "jinja2>=3.1.6",
    "pydantic-ai-slim[anthropic,google,logfire,openai]>=1.15.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "redis[hiredis]>=5.0.0",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.27",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
